<html lang="ko">
<head>

<title>🏡 우리집 보드</title>
<style>
  :root{
    --ivory:#FBF7F1; --pink:#E9AEB8; --pink-deep:#C8707F; --pink-soft:#FBEDEF;
    --sage:#9DB79C; --ink:#463C3A; --muted:#9C8C88; --line:#F1E6DE;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
    color:var(--ink);background:var(--ivory);font-size:15px;line-height:1.5;
    -webkit-text-size-adjust:100%;letter-spacing:-0.1px;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(120% 55% at 8% 0%, #FDECEE 0%, rgba(253,236,238,0) 62%),
      radial-gradient(95% 45% at 102% 8%, #EAF2E7 0%, rgba(234,242,231,0) 58%),
      #FBF7F1;
  }
  .wrap{position:relative;z-index:1;width:100%;max-width:360px;}
  .card{
    background:rgba(255,253,250,.92);border:1px solid #F7E3E4;border-radius:26px;
    padding:26px 20px 22px;box-shadow:0 14px 34px rgba(198,146,148,.16);
    text-align:center;backdrop-filter:blur(6px);
  }
  .badge{
    width:52px;height:52px;margin:0 auto 12px;border-radius:18px;
    display:flex;align-items:center;justify-content:center;font-size:26px;
    background:linear-gradient(158deg,#FFF7F6,#FBEDEF 60%,#F2F6EC);
    border:1px solid #F7E3E4;box-shadow:0 6px 14px rgba(198,146,148,.14);
  }
  h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-0.5px;color:#5B4643;}
  .sub{margin:7px 0 0;font-size:12.5px;color:var(--muted);font-weight:600;}
  .dots{display:flex;gap:9px;justify-content:center;margin:20px 0 4px;flex-wrap:nowrap;}
  .dot{
    width:13px;height:13px;flex:0 0 auto;border-radius:50%;border:1.5px solid #E4CFCF;background:transparent;
    transition:transform .12s, background .12s, border-color .12s;
  }
  .dot.on{background:var(--pink-deep);border-color:var(--pink-deep);transform:scale(1.06);}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0 0;}
  .key{
    height:52px;border-radius:16px;border:1px solid #F4E1E3;background:#FFFDFB;
    font-size:20px;font-weight:700;color:#5B4643;cursor:pointer;
    font-family:inherit;transition:transform .08s, background .12s, box-shadow .12s;
    box-shadow:0 2px 6px rgba(198,146,148,.07);
  }
  .key:active{transform:scale(.95);background:var(--pink-soft);}
  .key.fn{font-size:15px;color:#A9929A;font-weight:700;}
  .key:disabled{opacity:.45;}
  .msg{
    min-height:18px;margin:12px 0 0;font-size:12.5px;font-weight:700;color:#C05B6B;
    opacity:0;transition:opacity .18s;
  }
  .msg.show{opacity:1;}
  .remember{
    display:flex;align-items:center;justify-content:center;gap:7px;
    margin:16px 0 0;font-size:12.5px;color:#8E7C79;font-weight:600;cursor:pointer;
    user-select:none;
  }
  .remember input{
    appearance:none;-webkit-appearance:none;width:17px;height:17px;margin:0;border-radius:6px;
    border:1.5px solid #DFC9C6;background:#FFFDFB;cursor:pointer;position:relative;flex:0 0 auto;
  }
  .remember input:checked{background:var(--pink-deep);border-color:var(--pink-deep);}
  .remember input:checked::after{
    content:"";position:absolute;left:5px;top:1.5px;width:4px;height:8px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg);
  }
  .foot{margin:16px 0 0;font-size:11px;color:#B3A2A0;font-weight:600;letter-spacing:0;}
  .shake{animation:shake .32s;}
  @keyframes shake{
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
    40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}
  }
  .spin{
    width:16px;height:16px;border-radius:50%;border:2px solid #F0DDE0;border-top-color:var(--pink-deep);
    display:inline-block;vertical-align:-3px;margin-right:6px;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div class="badge">🏡</div>
    <h1>우리집 보드</h1>
    <p class="sub" id="sub">둘만 아는 8자리 PIN을 눌러 주세요</p>

    <div class="dots" id="dots" aria-hidden="true"></div>

    <div class="pad" id="pad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key fn" data-k="del">지움</button>
      <button class="key" data-k="0">0</button>
      <button class="key fn hidden" data-k="none" aria-hidden="true"></button>
    </div>

    <p class="msg" id="msg"></p>

    <label class="remember">
      <input type="checkbox" id="remember" checked>
      <span>이 기기에서 기억하기</span>
    </label>

    <p class="foot">🔒 내용은 암호화되어 있어요</p>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KEY_REMEMBER = "dih.rem.v1";
  var PINLEN = 8;
  var SUBTEXT = "둘만 아는 " + PINLEN + "자리 PIN을 눌러 주세요";
  var params = JSON.parse(document.getElementById("params").textContent);
  var payload = document.getElementById("payload").textContent.trim();
  var dotsBox = document.getElementById("dots");
  for (var d = 0; d < PINLEN; d++) {
    var s = document.createElement("span");
    s.className = "dot";
    dotsBox.appendChild(s);
  }
  var dots = [].slice.call(dotsBox.querySelectorAll(".dot"));
  var msgEl = document.getElementById("msg");
  var subEl = document.getElementById("sub");
  var cardEl = document.getElementById("card");
  var rememberEl = document.getElementById("remember");
  var padEl = document.getElementById("pad");
  var pin = "";
  var busy = false;

  function b64ToBytes(b64){
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function paint(){
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle("on", i < pin.length);
  }
  function showMsg(t){
    msgEl.textContent = t || "";
    msgEl.classList.toggle("show", !!t);
  }
  function lockKeys(on){
    busy = on;
    var keys = padEl.querySelectorAll(".key");
    for (var i = 0; i < keys.length; i++) keys[i].disabled = on;
  }
  function wasRemembered(){
    try { return localStorage.getItem(KEY_REMEMBER); } catch (e) { return null; }
  }
  function setRemembered(v){
    try {
      if (v) localStorage.setItem(KEY_REMEMBER, btoa(v));
      else localStorage.removeItem(KEY_REMEMBER);
    } catch (e) {}
  }

  function decrypt(p){
    if (!(window.crypto && window.crypto.subtle && window.crypto.subtle.deriveKey)) {
      return Promise.reject(new Error("nocrypto"));
    }
    var enc = new TextEncoder();
    return window.crypto.subtle.importKey("raw", enc.encode(p), "PBKDF2", false, ["deriveKey"])
      .then(function(mat){
        return window.crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(params.salt), iterations: params.iter, hash: "SHA-256" },
          mat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      })
      .then(function(key){
        return window.crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(params.iv) }, key, b64ToBytes(payload));
      })
      .then(function(buf){ return new TextDecoder("utf-8").decode(buf); });
  }

  function unlock(p, silent){
    if (busy) return;
    lockKeys(true);
    showMsg("");
    if (!silent) subEl.innerHTML = '<span class="spin"></span>여는 중…';
    decrypt(p).then(function(html){
      setRemembered(rememberEl.checked ? p : null);
      try {
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        subEl.textContent = "여는 중 문제가 생겼어요";
        showMsg("다시 시도해 주세요");
        lockKeys(false);
      }
    }).catch(function(err){
      lockKeys(false);
      setRemembered(null);
      pin = "";
      paint();
      subEl.textContent = SUBTEXT;
      if (err && err.message === "nocrypto") {
        showMsg("이 브라우저에서는 열 수 없어요");
        return;
      }
      showMsg(silent ? "PIN을 다시 입력해 주세요" : "PIN이 맞지 않아요");
      cardEl.classList.remove("shake");
      void cardEl.offsetWidth;
      cardEl.classList.add("shake");
    });
  }

  function press(k){
    if (busy) return;
    showMsg("");
    if (k === "del") {
      pin = pin.slice(0, -1);
      paint();
      return;
    }
    if (!/^[0-9]$/.test(k) || pin.length >= PINLEN) return;
    pin += k;
    paint();
    if (pin.length === PINLEN) {
      var attempt = pin;
      window.setTimeout(function(){ unlock(attempt, false); }, 90);
    }
  }

  padEl.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest(".key") : null;
    if (!b) return;
    press(b.getAttribute("data-k"));
  });

  document.addEventListener("keydown", function(e){
    if (busy) return;
    if (e.key >= "0" && e.key <= "9") { press(e.key); e.preventDefault(); }
    else if (e.key === "Backspace") { press("del"); e.preventDefault(); }
  });

  // 같은 기기에서 기억해 둔 PIN이 있으면 바로 열기
  var saved = wasRemembered();
  if (saved) {
    var p;
    try { p = atob(saved); } catch (e) { p = null; }
    if (p && new RegExp("^[0-9]{" + PINLEN + "}$").test(p)) {
      rememberEl.checked = true;
      pin = p; paint();
      unlock(p, true);
    } else {
      setRemembered(null);
    }
  }
})();
</script>
</body>
</html>
